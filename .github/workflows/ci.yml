name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [default, asan, ubsan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: brew list ninja >/dev/null 2>&1 || brew install ninja
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} --parallel
      - run: ctest --preset ${{ matrix.preset }} --output-on-failure
  python:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: brew list ninja >/dev/null 2>&1 || brew install ninja
      - run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r python/requirements.lock.txt
      - run: cmake --preset python -DMAM_PYTHON_EXECUTABLE="$PWD/.venv/bin/python"
      - run: cmake --build --preset python --parallel
      - run: ctest --preset python --output-on-failure
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/check_repository.py
      - name: Install pinned Gitleaks
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
      - run: GITLEAKS="$RUNNER_TEMP/gitleaks-bin/gitleaks" bash tools/check_secrets.sh
