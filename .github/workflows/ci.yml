name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      macos_runner:
        description: macOS runner (Intel is an explicit alternative, not ARM validation)
        type: choice
        default: macos-15
        options:
          - macos-15
          - macos-15-intel
permissions:
  contents: read
# Keep push, PR and manual checks separate; retire only superseded peers.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.macos_runner || 'macos-15' }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  native:
    name: native (${{ matrix.preset }}${{ inputs.macos_runner == 'macos-15-intel' && ', Intel alternative' || '' }})
    runs-on: ${{ inputs.macos_runner == 'macos-15-intel' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # One native job plus Python means at most two macOS jobs per run.
      max-parallel: 1
      matrix:
        preset: [default, asan, ubsan]
    env:
      MAM_CI_PRESET: ${{ matrix.preset }}
      MAM_CI_LOG_DIR: ${{ github.workspace }}/build/ci/native-${{ matrix.preset }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare build tools
        run: |
          mkdir -p "$MAM_CI_LOG_DIR"
          (brew list ninja >/dev/null 2>&1 || brew install ninja) 2>&1 | tee "$MAM_CI_LOG_DIR/dependencies.log"
      - name: Record toolchain
        run: |
          { sw_vers; uname -m; xcodebuild -version; clang++ --version; cmake --version; ninja --version; } 2>&1 | tee "$MAM_CI_LOG_DIR/toolchain.log"
      - name: Configure
        run: cmake --preset "$MAM_CI_PRESET" 2>&1 | tee "$MAM_CI_LOG_DIR/configure.log"
      - name: Build
        run: cmake --build --preset "$MAM_CI_PRESET" --parallel 3 2>&1 | tee "$MAM_CI_LOG_DIR/build.log"
      - name: Test
        run: ctest --preset "$MAM_CI_PRESET" --output-on-failure --output-junit "$MAM_CI_LOG_DIR/ctest.xml" 2>&1 | tee "$MAM_CI_LOG_DIR/ctest.log"
      - name: Retain diagnostics
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.preset }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.MAM_CI_LOG_DIR }}/*.log
            ${{ env.MAM_CI_LOG_DIR }}/ctest.xml
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
            build/${{ matrix.preset }}/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
          retention-days: 7
  python:
    name: ${{ inputs.macos_runner == 'macos-15-intel' && 'python (Intel alternative)' || 'python' }}
    runs-on: ${{ inputs.macos_runner == 'macos-15-intel' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 30
    env:
      MAM_CI_LOG_DIR: ${{ github.workspace }}/build/ci/python
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Prepare build and audio tools
        run: |
          mkdir -p "$MAM_CI_LOG_DIR"
          {
            brew list ninja >/dev/null 2>&1 || brew install ninja
            brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          } 2>&1 | tee "$MAM_CI_LOG_DIR/dependencies.log"
      - name: Prepare Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r python/requirements.lock.txt 2>&1 | tee "$MAM_CI_LOG_DIR/python-dependencies.log"
      - name: Record toolchain
        run: |
          { sw_vers; uname -m; xcodebuild -version; clang++ --version; cmake --version; ninja --version; .venv/bin/python --version; } 2>&1 | tee "$MAM_CI_LOG_DIR/toolchain.log"
      - name: Configure
        run: cmake --preset python -DMAM_PYTHON_EXECUTABLE="$PWD/.venv/bin/python" 2>&1 | tee "$MAM_CI_LOG_DIR/configure.log"
      - name: Build
        run: cmake --build --preset python --parallel 3 2>&1 | tee "$MAM_CI_LOG_DIR/build.log"
      - name: Test native and Python suites
        run: ctest --preset python --output-on-failure --output-junit "$MAM_CI_LOG_DIR/ctest.xml" 2>&1 | tee "$MAM_CI_LOG_DIR/ctest.log"
      - name: Retain diagnostics
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.MAM_CI_LOG_DIR }}/*.log
            ${{ env.MAM_CI_LOG_DIR }}/ctest.xml
            build/python/Testing/Temporary/LastTest.log
            build/python/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
          retention-days: 7
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check repository hygiene
        run: python3 tools/check_repository.py
      - name: Install pinned actionlint
        run: |
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 120 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint-bin" actionlint
      - name: Validate workflows
        run: '"$RUNNER_TEMP/actionlint-bin/actionlint" -color'
      - name: Install pinned Gitleaks
        run: |
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
      - name: Scan source and history for secrets
        run: GITLEAKS="$RUNNER_TEMP/gitleaks-bin/gitleaks" bash tools/check_secrets.sh
